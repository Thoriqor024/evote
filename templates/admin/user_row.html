<tr class="transition-colors hover:bg-base-200/60">
    <td class="text-center">
        <input type="checkbox" name="user_ids" value="{{ voter.id }}" class="user-cb checkbox checkbox-sm cursor-pointer">
    </td>
    <td class="font-medium">{{ voter.student_id }}</td>
    <td>
        <span class="badge badge-ghost badge-sm uppercase tracking-wide">{{ voter.role }}</span>
    </td>
    <td class="text-center">
        <button
            hx-delete="/admin/users/{{ voter.student_id }}"
            hx-target="closest tr"
            hx-swap="outerHTML"
            hx-confirm="Hapus akun siswa ini? Tindakan ini tidak dapat dibatalkan."
            class="btn btn-xs btn-ghost gap-1 text-error">
            <i data-lucide="trash-2"></i> Hapus
        </button>
    </td>
</tr>
